[project]
name = "adversarial-agent-evaluation"
version = "0.3.0"
description = "Automated adversarial security testing and evaluation for AI agents"
authors = []
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[project.scripts]
adversarial-agent-evaluation = "adversarial_agent_evaluation.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Standard src layout: the importable package is `adversarial_agent_evaluation`,
# so installing this project no longer claims the generic top-level name `src`.
where = ["src"]
include = ["adversarial_agent_evaluation*"]

[project.optional-dependencies]
test = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "httpx>=0.24,<1.0",
]
dev = [
    "ruff>=0.0.292,<1.0",
    "black>=23.0,<25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let `pytest` resolve the package from a fresh clone without requiring
# `pip install -e .` first (the package lives under src/).
pythonpath = ["src"]
